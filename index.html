<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeQuest - Gamifica tu día</title>
<style>
    body {
        font-family: 'Arial', sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        margin: 0;
        padding: 20px;
    }
    .container {
        max-width: 600px;
        margin: auto;
        background: rgba(0,0,0,0.3);
        padding: 20px;
        border-radius: 20px;
        box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .header {
        text-align: center;
        margin-bottom: 20px;
    }
    .stats {
        display: flex;
        justify-content: space-around;
        background: rgba(255,255,255,0.1);
        padding: 15px;
        border-radius: 15px;
        margin-bottom: 20px;
    }
    .stat h2 { margin: 5px 0; font-size: 24px; }
    .stat p { margin: 0; font-size: 12px; opacity: 0.8; }
    .progress-bar {
        height: 10px;
        background: rgba(255,255,255,0.2);
        border-radius: 5px;
        overflow: hidden;
        margin-top: 5px;
    }
    .progress {
        height: 100%;
        background: #4ade80;
        width: 0%;
        transition: width 0.5s;
    }
    input {
        width: 70%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        margin-right: 10px;
    }
    button {
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        background: #4ade80;
        color: #1a1a1a;
        font-weight: bold;
        cursor: pointer;
    }
    button:hover { background: #22c55e; }
    .task {
        background: rgba(255,255,255,0.1);
        padding: 15px;
        margin: 10px 0;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        transition: 0.3s;
    }
    .task:hover { background: rgba(255,255,255,0.2); }
    .task.done {
        text-decoration: line-through;
        opacity: 0.5;
    }
    .xp-gain {
        color: #4ade80;
        font-weight: bold;
        animation: pop 0.5s;
    }
    @keyframes pop {
        0% { transform: scale(1); }
        50% { transform: scale(1.5); }
        100% { transform: scale(1); }
    }
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>⚔️ LifeQuest</h1>
        <p>Convierte tu día en una aventura</p>
    </div>

    <div class="stats">
        <div class="stat">
            <h2 id="level">1</h2>
            <p>NIVEL</p>
            <div class="progress-bar"><div class="progress" id="level-progress"></div></div>
        </div>
        <div class="stat">
            <h2 id="xp">0</h2>
            <p>XP</p>
        </div>
        <div class="stat">
            <h2 id="streak">0</h2>
            <p>RACHA</p>
        </div>
    </div>

    <div>
        <input type="text" id="taskInput" placeholder="Nueva misión... Ej: Hacer ejercicio">
        <button onclick="addTask()">+ Añadir</button>
    </div>

    <div id="taskList"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem('lifequest')) || {
    xp: 0,
    level: 1,
    streak: 0,
    tasks: []
};

function save() {
    localStorage.setItem('lifequest', JSON.stringify(data));
}

function xpNeeded() {
    return data.level * 100;
}

function updateStats() {
    document.getElementById('xp').innerText = data.xp;
    document.getElementById('level').innerText = data.level;
    document.getElementById('streak').innerText = data.streak;
    
    let progress = (data.xp % xpNeeded()) / xpNeeded() * 100;
    document.getElementById('level-progress').style.width = progress + '%';

    if(data.xp >= xpNeeded()) {
        data.level++;
        data.xp = 0;
        alert(`¡SUBISTE A NIVEL ${data.level}! 🎉`);
        updateStats();
    }
}

function addTask() {
    let input = document.getElementById('taskInput');
    if(input.value.trim() === '') return;
    data.tasks.push({text: input.value, done: false, xp: 25});
    input.value = '';
    renderTasks();
    save();
}

function completeTask(index) {
    if(!data.tasks[index].done) {
        data.tasks[index].done = true;
        data.xp += data.tasks[index].xp;
        showXPGain(`+${data.tasks[index].xp} XP`);
        updateStats();
        renderTasks();
        save();
    }
}

function showXPGain(text) {
    let el = document.createElement('div');
    el.className = 'xp-gain';
    el.innerText = text;
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1000);
}

function renderTasks() {
    let list = document.getElementById('taskList');
    list.innerHTML = '';
    data.tasks.forEach((task, i) => {
        list.innerHTML += `
            <div class="task ${task.done ? 'done' : ''}" onclick="completeTask(${i})">
                <span>📝 ${task.text}</span>
                <span>+${task.xp} XP</span>
            </div>
        `;
    });
}

renderTasks();
updateStats();
</script>
</body>
</html>
