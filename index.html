<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeQuest</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#6a11cb">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto&display=swap');
    
    body {
      background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
      color: white;
      font-family: 'Roboto', sans-serif;
      margin: 0;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 500px;
      margin: auto;
      background: rgba(0,0,0,0.3);
      padding: 20px;
      border-radius: 20px;
      box-shadow: 0 0 20px rgba(106,17,203,0.5);
    }
    h1 {
      font-family: 'Orbitron', sans-serif;
      text-align: center;
      text-shadow: 0 0 10px #fff;
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #fff; }
      to { text-shadow: 0 0 20px #2575fc; }
    }
    .stats {
      display: flex;
      justify-content: space-around;
      margin: 20px 0;
      font-size: 18px;
    }
    input, button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }
    button {
      background: #ff00ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 15px #ff00ff;
    }
    .mision {
      background: rgba(255,255,255,0.1);
      padding: 10px;
      border-radius: 10px;
      margin: 10px 0;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>⚔️ LIFEQUEST ⚔️</h1>
    <div class="stats">
      <div>Nivel: <b id="nivel">1</b></div>
      <div>XP: <b id="xp">0</b></div>
      <div>Racha: <b id="racha">0</b> 🔥</div>
    </div>
    
    <input type="text" id="mision" placeholder="Escribe tu misión épica...">
    <button onclick="agregarMision()">+ Añadir Misión</button>
    
    <div id="listaMisiones"></div>
  </div>

<script>
let data = JSON.parse(localStorage.getItem('lifequest')) || {nivel:1, xp:0, racha:0, misiones:[]};

function guardar(){ localStorage.setItem('lifequest', JSON.stringify(data)); }

function render(){
  document.getElementById('nivel').innerText = data.nivel;
  document.getElementById('xp').innerText = data.xp;
  document.getElementById('racha').innerText = data.racha;
  document.getElementById('listaMisiones').innerHTML = data.misiones.map((m,i)=>`
    <div class="mision">
      <span>${m}</span>
      <button onclick="completar(${i})">✓</button>
    </div>
  `).join('');
}

function agregarMision(){
  let m = document.getElementById('mision').value;
  if(m){ data.misiones.push(m); document.getElementById('mision').value=''; guardar(); render(); }
}

function completar(i){
  data.misiones.splice(i,1);
  data.xp += 10;
  if(data.xp >= data.nivel * 50){ data.nivel++; data.xp=0; alert('¡SUBISTE A NIVEL '+data.nivel+'! 👑'); }
  data.racha++;
  guardar(); render();
}

render();

// Registrar Service Worker
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
</script>
</body>
</html>
